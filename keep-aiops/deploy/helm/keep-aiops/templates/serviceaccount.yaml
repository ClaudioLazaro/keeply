{{- if .Values.mcpGateway.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "keep-aiops.gatewayServiceAccountName" . }}
  labels:
    {{- include "keep-aiops.labels" . | nindent 4 }}
    {{- include "keep-aiops.gatewaySelectorLabels" . | nindent 4 }}
  {{- with .Values.mcpGateway.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
