{{- if .Values.migrate.enabled }}
# Schema migrations as a pre-install/pre-upgrade hook: boring and fail-closed.
# `alembic upgrade head` must succeed before any new aiops-api pod rolls;
# before-hook-creation reaps the previous hook Job so upgrades re-run cleanly.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "keep-aiops.migrateName" . }}
  labels:
    {{- include "keep-aiops.labels" . | nindent 4 }}
    {{- include "keep-aiops.apiSelectorLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "keep-aiops.labels" . | nindent 8 }}
        {{- include "keep-aiops.apiSelectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ include "keep-aiops.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
          env:
            {{- include "keep-aiops.databaseEnv" . | nindent 12 }}
            - name: AIOPS_AUTO_CREATE_TABLES
              value: "false"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
{{- end }}
