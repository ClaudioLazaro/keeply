# ServiceAccount + RBAC for the MCP Kubernetes server to read live evidence.
#
# Split deliberately into two grants, because two very different things were
# collapsed into one cluster-wide role:
#
#   locating a service   needs to see that pods and namespaces EXIST, anywhere
#   reading container output  is where credentials and personal data leak
#
# The old single ClusterRole granted `pods/log` across every namespace, so the
# AI plane could read the logs of every project sharing the cluster. Scoping
# gathering to the incident fixed which namespaces we *ask* about; this fixes
# which ones we *can* read. Application discipline and access control should
# not be the same control.
#
# Events stay cluster-wide on purpose. They are metadata — scheduling, probe
# failures, image pulls — and the most useful signal on this cluster came from
# node-level events like FreeDiskSpaceFailed, which belong to no application
# namespace. Hiding those to protect data they do not carry would cost real
# diagnostic power for no privacy gain.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keep-mcp
  namespace: keeply
---
# Cluster-wide, metadata only: what exists and where.
#
# find_workload matches a service to its namespace by pod name — a service
# called `identity-svc` running in a namespace called `cafecafe` is only
# findable this way. That needs listing, not reading: `list pods` returns
# names, phases and node placement, never container output.
#
# Deliberately absent: pods/log. Discovery must not imply readability.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: keep-mcp-locator
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: keep-mcp-locator
subjects:
  - kind: ServiceAccount
    name: keep-mcp
    namespace: keeply
roleRef:
  kind: ClusterRole
  name: keep-mcp-locator
  apiGroup: rbac.authorization.k8s.io
---
# Container output — granted cluster-wide, deliberately.
#
# Every namespace here belongs to the same owner, and an AIOps platform that
# cannot read the logs of the workloads it investigates is doing half an
# investigation: it can report that a pod is CrashLoopBackOff and never say
# why. That trade was made knowingly.
#
# It is kept as its own ClusterRole rather than folded back into the locator
# role for two reasons. The original grant hid `pods/log` inside a list of
# four resources, where nothing marked it as the sensitive one; here the
# sensitive capability has its own name, its own binding, and this comment.
# And narrowing it later is a small, local edit — see below.
#
# WHAT THIS ALLOWS: reading the container output of every pod on the cluster,
# which is where credentials, tokens and personal data show up. That output
# becomes evidence, is stored in the investigation payload, and is sent to
# whichever LLM provider is configured.
#
# TO NARROW IT: delete the ClusterRoleBinding below and replace it with one
# RoleBinding per readable namespace, same roleRef — a ClusterRole referenced
# by a RoleBinding grants only inside that namespace.
#
#   kind: RoleBinding
#   metadata: {name: keep-mcp-log-reader, namespace: <ns>}
#   subjects: [{kind: ServiceAccount, name: keep-mcp, namespace: keeply}]
#   roleRef: {kind: ClusterRole, name: keep-mcp-log-reader, apiGroup: rbac.authorization.k8s.io}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: keep-mcp-log-reader
rules:
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: keep-mcp-log-reader
subjects:
  - kind: ServiceAccount
    name: keep-mcp
    namespace: keeply
roleRef:
  kind: ClusterRole
  name: keep-mcp-log-reader
  apiGroup: rbac.authorization.k8s.io
---
# Traefik middlewares (mirrors cafecafe-security-headers pattern).
# Used by the keeply ingresses to keep Cloudflare happy.
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: keeply-security-headers
  namespace: keeply
spec:
  headers:
    frameDeny: true
    sslRedirect: true
    browserXssFilter: true
    contentTypeNosniff: true
    stsIncludeSubdomains: true
    stsSeconds: 31536000
